name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    name: Typecheck → Test → Build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify workspace
        run: MBD_SKIP_SMOKE_GATE=1 pnpm verify

      - name: Verify smoke gate
        run: pnpm --filter @mbd/sim-core exec vitest run tests/smokeGate.integration.test.ts --reporter=verbose

      - name: Verify sim-core determinism snapshot
        run: cd packages/sim-core && node ./node_modules/vitest/vitest.mjs run tests/determinism.snapshot.test.ts

      - name: Install Playwright Chromium
        run: pnpm --filter @mbd/web exec playwright install --with-deps chromium

      - name: Verify hard-reload trust journey
        run: pnpm e2e:reload-smoke

      - name: Upload Playwright failure evidence
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-reload-smoke
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 14
